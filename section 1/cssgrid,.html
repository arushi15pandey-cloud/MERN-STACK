<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .child{
            background-color: lightcoral;
            color: rgb(63, 20, 220);
            font-size: 40px;
            padding: 30px;
            border: 2px solid rgb(21, 20, 20);
        }

       .parent{
        display: grid;
        /*grid-template-columns: 200px 500px 700px;*/
        grid-template-columns: 1fr 3fr 5fr;
        grid-template-rows: 1fr 1fr 1fr;
        gap: 30px;
       }

    </style>
</head>
<body>
    <div class="parent">
        <div class="child">child 1</div>
        <div class="child">child 2</div>
        <div class="child">child 3</div>
        <div class="child">child 4</div>
        <div class="child">child 5</div>
        <div class="child">child 6</div>
        <div class="child">child 7</div>
        <div class="child">child 8</div>
        <div class="child">child 9</div>
        <div class="child">child 10</div>
        <div class="child">child 11</div>
        <div class="child">child 12</div>
    </div>
</body>
</html>
